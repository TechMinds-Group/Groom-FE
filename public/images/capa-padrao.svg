<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Overlay Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Gold Accent Line -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="30%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>

    <!-- Dark Vignette Overlay -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>

    <!-- Geometric Hexagon Pattern -->
    <pattern id="hexPattern" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="scale(1)">
      <path d="M20 0 L40 11.5 L40 34.5 L20 46 L0 34.5 L0 11.5 Z" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  
  <!-- Subtle Texture Pattern -->
  <rect width="1200" height="400" fill="url(#hexPattern)"/>
  
  <!-- Glow Curves -->
  <path d="M-100 200 Q 300 50, 600 220 T 1300 150" fill="none" stroke="url(#accentGrad)" stroke-width="120" filter="blur(30px)"/>
  <path d="M-50 100 Q 400 350, 900 100 T 1350 300" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.6"/>

  <!-- Decorative Barber Scissors Silhouette on Right -->
  <g transform="translate(920, 70) scale(1.4)" opacity="0.06" fill="#ffffff">
    <path d="M 90 20 C 75 20, 65 32, 65 45 C 65 54, 70 62, 78 66 L 55 110 L 48 100 C 53 96, 56 90, 56 83 C 56 70, 44 60, 30 60 C 16 60, 4 70, 4 83 C 4 96, 16 106, 30 106 C 37 106, 43 103, 47 98 L 55 110 L 32 154 C 27 150, 21 148, 15 148 C 6 148 0 155 0 163 C 0 172, 6 179, 15 179 C 24 179, 30 172, 30 163 C 30 160, 29 157, 27 154 L 55 110 L 83 154 C 81 157, 80 160, 80 163 C 80 172, 86 179, 95 179 C 104 179, 110 172, 110 163 C 110 155, 104 148, 95 148 C 89 148, 83 150, 78 154 L 55 110 L 78 66 C 85 62, 90 54, 90 45 C 90 32, 80 20, 90 20 Z"/>
  </g>

  <!-- Decorative Barber Pole Stripe Accent on Left -->
  <g transform="translate(60, 0)" opacity="0.08">
    <line x1="0" y1="0" x2="200" y2="400" stroke="#3b82f6" stroke-width="25"/>
    <line x1="40" y1="0" x2="240" y2="400" stroke="#ef4444" stroke-width="25"/>
    <line x1="80" y1="0" x2="280" y2="400" stroke="#ffffff" stroke-width="25"/>
  </g>

  <!-- Vignette Tint -->
  <rect width="1200" height="400" fill="url(#vignette)"/>

  <!-- Bottom Gradient Bleed -->
  <rect x="0" y="280" width="1200" height="120" fill="url(#bgGrad)" opacity="0.4"/>
</svg>
