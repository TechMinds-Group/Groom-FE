<div class="d-flex flex-column h-100 overflow-hidden main-layout-container">
  <!-- Top Bar para Dispositivos Móveis Móvel (< 576px / menor que sm) -->
  <header class="mobile-header d-sm-none d-flex align-items-center justify-content-between px-3 py-2 border-bottom">
    <div class="d-flex align-items-center gap-3">
      <button
        type="button"
        class="btn btn-icon btn-mobile-toggle text-light p-2"
        (click)="toggleMobileDrawer()"
        aria-label="Abrir Menu"
      >
        <i class="fas fa-bars fs-2"></i>
      </button>

      <div class="d-flex align-items-center gap-2 brand-logo-wrap">
        <img src="logo.png" alt="Groom Logo" class="mobile-logo" />
        <span class="fw-bold fs-4 brand-title">Groom</span>
      </div>
    </div>
  </header>

  <div class="d-flex flex-grow-1 overflow-hidden position-relative">
    <!-- Sidebar Desktop (>= 576px / >= sm) -->
    <aside class="sidebar-column d-none d-sm-flex flex-column" [class.is-collapsed]="sidebarCollapsed()">
      <app-sidebar (logout)="handleLogout()" (themeToggle)="handleThemeToggle()" (collapseChange)="sidebarCollapsed.set($event)"></app-sidebar>
      <a class="version-badge" routerLink="/guia" title="Guia do Sistema">
        <i class="fas fa-tag"></i>
        @if (!sidebarCollapsed()) {
          <span class="ms-1">V 1.1.0</span>
        }
      </a>
    </aside>

    <!-- Overlay / Offcanvas Drawer Mobile (< 576px / menor que sm) -->
    @if (mobileDrawerOpen()) {
      <div class="mobile-drawer-backdrop d-sm-none" (click)="closeMobileDrawer()"></div>
    }

    <aside
      class="mobile-drawer-panel d-sm-none flex-column"
      [class.is-open]="mobileDrawerOpen()"
    >
      <button
        type="button"
        class="btn btn-icon btn-close-drawer text-light p-2 position-absolute top-0 end-0 m-2 z-3"
        (click)="closeMobileDrawer()"
        aria-label="Fechar Menu"
      >
        <i class="fas fa-times fs-2"></i>
      </button>

      <div class="mobile-drawer-body flex-grow-1 overflow-y-auto">
        <app-sidebar (logout)="handleLogout()" (themeToggle)="handleThemeToggle()"></app-sidebar>
      </div>

      <div class="mobile-drawer-footer border-top p-3 text-center">
        <a class="version-badge border-0" routerLink="/guia" (click)="closeMobileDrawer()">
          <i class="fas fa-tag text-warning me-1"></i>
          <span>V 1.1.0 — Guia do Sistema</span>
        </a>
      </div>
    </aside>

    <!-- Conteúdo Principal da Aplicação -->
    <div class="main-column flex-grow-1 d-flex flex-column min-width-0 overflow-hidden">
      <main class="main-content flex-grow-1 overflow-auto position-relative">
        <router-outlet></router-outlet>
      </main>
      <app-footer></app-footer>
    </div>
  </div>
</div>

<app-sidebar-modal-idioma [(show)]="showIdiomaModal" />

<!-- Modal Personalizado de Aviso de Assinatura (Configurado via SG) -->
@if (avisoModalData(); as aviso) {
  <tm-modal
    [(show)]="showAvisoModal"
    [title]="aviso.titulo"
    size="md"
    [showFooter]="false"
  >
    <div class="p-3 text-center">
      <div class="mb-4">
        <div
          class="rounded-circle d-inline-flex align-items-center justify-content-center p-3 shadow-lg"
          [class]="aviso.tipo === 'proximo' ? 'bg-warning-subtle text-warning' : 'bg-danger-subtle text-danger'"
          style="width: 70px; height: 70px;"
        >
          <i [class]="aviso.tipo === 'proximo' ? 'fas fa-exclamation-triangle fs-1' : 'fas fa-lock fs-1'"></i>
        </div>
      </div>

      <h4 class="h5 fw-bold mb-3 custom-dark-text">
        {{ aviso.titulo }}
      </h4>

      <p class="text-muted custom-dark-text mb-4 fs-6 leading-relaxed">
        {{ aviso.mensagem }}
      </p>

      <div class="d-flex flex-column flex-sm-row justify-content-center gap-2 pt-3 border-top border-secondary">
        @if (!bloqueioTotal() && aviso.labelBotaoFechar) {
          <button
            type="button"
            class="btn btn-secondary px-4 py-2.5 fw-semibold"
            (click)="fecharAvisoModal()"
          >
            {{ aviso.labelBotaoFechar }}
          </button>
        }
        <button
          type="button"
          class="btn btn-primary px-4 py-2.5 fw-bold shadow-sm"
          (click)="irParaAssinatura()"
        >
          <i class="fas fa-credit-card me-2"></i> {{ aviso.labelBotaoIrParaAssinatura || 'Ir para Assinatura' }}
        </button>
      </div>
    </div>
  </tm-modal>
}
