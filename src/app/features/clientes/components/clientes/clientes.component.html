<div class="container mt-5 mb-5">
  <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between mb-4 gap-3">
    <div>
      <h1 class="h2 text-primary fw-bold mb-2 custom-dark-text d-flex align-items-center gap-2">
        <i class="fas fa-users me-2"></i>Clientes
      </h1>
      <p class="text-muted custom-dark-text mb-0">
        Visualize a lista de clientes cadastrados no sistema. Clique no cliente para visualizar seus detalhes completos.
      </p>
    </div>

    <div>
      <button
        (click)="abrirNovo()"
        class="btn btn-primary px-4 py-2.5 shadow-sm fw-bold rounded-3 d-inline-flex align-items-center gap-2"
      >
        <i class="fas fa-user-plus"></i><span>Cadastrar</span>
      </button>
    </div>
  </div>

  <div class="mb-5">
    <tm-table
      [cols]="cols()"
      [data]="clientesService.clientes()"
      [paginated]="true"
      [pageSize]="tamanhoPagina()"
      (pageSizeChange)="tamanhoPagina.set($event)"
      [showControls]="true"
      (rowClick)="verDetalhes($event)"
    ></tm-table>
  </div>
</div>

<ng-template #clienteTemplate let-item>
  <div class="d-flex flex-column text-start">
    <strong class="fw-bold custom-dark-text">{{ helper.getNomeCompleto(item) }}</strong>
  </div>
</ng-template>

<ng-template #celularTemplate let-item>
  <div class="d-flex align-items-center">
    <span class="custom-dark-text">
      <i class="fab fa-whatsapp text-success me-1"></i>{{ item.celular }}
    </span>
  </div>
</ng-template>

<ng-template #statusTemplate let-item>
  <div class="d-flex align-items-center gap-2">
    @if (item.status | statusClienteBadge; as badge) {
      <span class="badge border px-2.5 py-1 rounded-pill small fw-semibold" [ngClass]="badge.badgeClass">
        <i [class]="badge.iconClass" class="me-1"></i>{{ badge.label }}
      </span>
    }
  </div>
</ng-template>
