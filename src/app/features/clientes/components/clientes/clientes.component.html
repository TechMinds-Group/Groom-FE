<div class="container-fluid px-2 px-sm-3 px-lg-4 py-2 py-sm-4">
  <div class="row mb-3 align-items-center">
    <div class="col-12 col-sm-8 mb-2 mb-sm-0">
      <h1 class="h3 text-primary fw-bold mb-1 custom-dark-text d-flex align-items-center gap-2">
        <i class="fas fa-users text-primary"></i>Clientes
      </h1>
      <p class="text-muted custom-dark-text small mb-0">
        Gerencie os clientes cadastrados no sistema. Clique no cliente para ver detalhes completos.
      </p>
    </div>
    <div class="col-12 col-sm-4 d-flex justify-content-sm-end">
      <button (click)="abrirNovo()" class="btn btn-primary px-3 py-2 shadow-sm fw-semibold w-100 w-sm-auto d-flex align-items-center justify-content-center gap-2">
        <i class="fas fa-user-plus"></i>Cadastrar
      </button>
    </div>
  </div>

  <div class="table-responsive-wrapper mb-4">
    <tm-table
      [cols]="cols()"
      [data]="clientesService.clientes()"
      [paginated]="true"
      [pageSize]="tamanhoPagina()"
      (pageSizeChange)="tamanhoPagina.set($event)"
      [showControls]="true"
      searchPlaceholder="Buscar por nome, email ou celular..."
    ></tm-table>
  </div>
</div>

<ng-template #clienteTemplate let-item>
  <div class="d-flex align-items-center justify-content-between cursor-pointer w-100 cell-truncate" (click)="verDetalhes(item)">
    <div class="cell-truncate">
      <strong class="fw-bold custom-dark-text d-block">
        {{ helper.separarNome(item).primeiroNome }}
      </strong>
      <span class="small text-muted custom-dark-text d-block">
        {{ helper.separarNome(item).sobrenome }}
      </span>
      <span class="small text-muted custom-dark-text d-block">
        <i class="fas fa-phone me-1 opacity-75"></i>{{ item.celular }}
      </span>
    </div>
    <i class="fas fa-chevron-right text-muted opacity-50 flex-shrink-0 ms-2"></i>
  </div>
</ng-template>

<ng-template #statusTemplate let-item>
  <div class="d-flex h-100 align-items-center cursor-pointer" (click)="verDetalhes(item)">
    @if (item.status | statusClienteBadge; as badge) {
      <span class="badge border rounded-pill small fw-semibold text-nowrap" [ngClass]="badge.badgeClass">
        <i [class]="badge.iconClass"></i>{{ badge.label }}
      </span>
    }
  </div>
</ng-template>
