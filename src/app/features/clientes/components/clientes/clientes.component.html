<div class="container mt-5">
  <div class="row mb-4 align-items-center">
    <div class="col-lg-8 col-12">
      <h1 class="h2 text-primary fw-bold mb-2 custom-dark-text">
        <i class="fas fa-users me-2"></i>Clientes
      </h1>
      <p class="text-muted custom-dark-text">
        Gerencie os clientes cadastrados no sistema.
      </p>
    </div>
    <div class="col-lg-4 col-12 mt-3 mt-lg-0 d-grid d-lg-flex justify-content-lg-end">
      <button (click)="abrirNovo()" class="btn btn-primary px-4 py-2 shadow-sm fw-semibold">
        <i class="fas fa-user-plus me-2"></i>Cadastrar
      </button>
    </div>
  </div>

  <div class="mb-5">
    <tm-table
      [cols]="cols()"
      [data]="clientesService.clientes()"
      [paginated]="true"
      [pageSize]="tamanhoPagina()"
      (pageSizeChange)="tamanhoPagina.set($event)"
      [showControls]="true"
      searchPlaceholder="Buscar por nome, email ou celular..."
    ></tm-table>
  </div>
</div>

<app-cliente-modal-editar
  [(show)]="showFormModal"
  [cliente]="clienteEmEdicao()"
  (confirm)="salvar($event)"
  (cancel)="showFormModal.set(false)"
></app-cliente-modal-editar>

<app-cliente-modal-excluir
  [(show)]="showDeleteModal"
  [nomeCliente]="clienteParaExcluir()?.nome || ''"
  (confirm)="excluir()"
  (cancel)="showDeleteModal.set(false)"
></app-cliente-modal-excluir>

<ng-template #nomeTemplate let-item>
  <div class="d-flex flex-column text-start">
    <strong class="fw-bold custom-dark-text">{{ item.nome }}</strong>
    <span class="text-muted small custom-dark-text">{{ item.cpf ? helper.formatarCpf(item.cpf) : '' }}</span>
  </div>
</ng-template>

<ng-template #contatoTemplate let-item>
  <div class="d-flex flex-column text-start">
    <span class="custom-dark-text">{{ item.celular }}</span>
    @if (item.email) {
      <span class="text-muted small custom-dark-text">{{ item.email }}</span>
    }
  </div>
</ng-template>

<ng-template #statusTemplate let-item>
  <div class="d-flex align-items-center gap-2">
    @if (item.status | statusClienteBadge; as badge) {
      <span class="badge border px-2.5 py-1 rounded-pill small fw-semibold" [ngClass]="badge.badgeClass">
        <i [class]="badge.iconClass"></i>{{ badge.label }}
      </span>
    }
  </div>
</ng-template>

<ng-template #acoesTemplate let-item>
  <div class="d-flex gap-2">
    <button class="btn btn-sm btn-outline-primary" (click)="abrirEdicao(item)" title="Editar">
      <i class="fas fa-edit"></i>
    </button>
    <button class="btn btn-sm btn-outline-danger" (click)="confirmarExclusao(item)" title="Excluir">
      <i class="fas fa-trash"></i>
    </button>
  </div>
</ng-template>
