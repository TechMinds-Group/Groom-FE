<tm-modal
  [title]="'Entrar na lista de espera'"
  confirmLabel="Entrar na lista"
  cancelLabel="Cancelar"
  [show]="show()"
  (showChange)="show.set($event)"
  (confirm)="confirmar()"
  (cancel)="fechar()"
  confirmClass="btn-primary"
  icon="fa-solid fa-hourglass-half"
  size="md"
>
  <div class="p-1 text-start" [formGroup]="form">
    <p class="lista-espera-modal__descricao text-muted mb-3">
      Deixe suas preferências e avisaremos quando uma vaga abrir hoje. Todos os campos são
      opcionais.
    </p>

    @if (carregandoOpcoes()) {
      <div class="text-center text-muted py-4">
        <i class="fas fa-spinner fa-spin me-2"></i>Carregando opções...
      </div>
    } @else {
      <div class="mb-3">
        <tm-select
          formControlName="servicoId"
          [control]="form.controls.servicoId"
          [options]="servicoOptions()"
          label="Serviço desejado"
          icon="fa-solid fa-scissors"
          placeholder="Qualquer serviço"
          [clearable]="true"
          [darkMode]="isDark()"
        ></tm-select>
      </div>

      <div class="mb-2">
        <tm-select
          formControlName="profissionalId"
          [control]="form.controls.profissionalId"
          [options]="profissionalOptions()"
          label="Profissional"
          icon="fa-solid fa-user"
          placeholder="Qualquer profissional"
          [clearable]="true"
          [darkMode]="isDark()"
        ></tm-select>
      </div>

      @if (horaEspecifica()) {
        <!-- RN-074 — modo slot clicado: o horário desejado é exatamente o clicado; a
        janela início+fim é calculada automaticamente (sem campo editável). -->
        <div class="lista-espera-modal__horario mt-3" [class.lista-espera-modal__horario--dark]="isDark()">
          <i class="fa-regular fa-clock me-2"></i>
          Horário desejado: <strong>{{ horaEspecifica() }}</strong> — avisaremos assim que
          ele abrir.
        </div>
      } @else {
        <div class="mt-3">
          <tm-time
            formControlName="horaJanelaInicio"
            [control]="form.controls.horaJanelaInicio"
            label="A partir de que horas (opcional)"
            icon="fa-regular fa-clock text-muted"
            placeholder="00:00"
            [darkMode]="isDark()"
          ></tm-time>
        </div>
      }
    }
  </div>
</tm-modal>
