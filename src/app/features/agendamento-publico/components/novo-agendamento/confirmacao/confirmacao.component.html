<div class="text-center">
  <div class="agendamento-confirmacao__icone mb-3">
    <i class="fas fa-check"></i>
  </div>
  <h2 class="h4 mb-1">Agendamento confirmado!</h2>
  <p class="text-muted">Você receberá as informações do seu horário.</p>

  <ul class="list-group text-start mb-4">
    <li class="list-group-item d-flex justify-content-between">
      <span class="text-muted">Profissional</span>
      <span class="fw-semibold">{{ agendamento().profissionalNome }}</span>
    </li>
    <li class="list-group-item d-flex justify-content-between">
      <span class="text-muted">Serviço</span>
      <span class="fw-semibold">{{ agendamento().servicoNome }}</span>
    </li>
    <li class="list-group-item d-flex justify-content-between">
      <span class="text-muted">Data</span>
      <span class="fw-semibold">{{ formatarData(agendamento().dataInicio) }}</span>
    </li>
    <li class="list-group-item d-flex justify-content-between">
      <span class="text-muted">Valor</span>
      <span class="fw-semibold text-primary">{{ formatarPreco(agendamento().servicoPreco) }}</span>
    </li>
  </ul>

  <button type="button" class="btn btn-outline-primary w-100" (click)="voltarInicio.emit()">
    Voltar ao início
  </button>
</div>
