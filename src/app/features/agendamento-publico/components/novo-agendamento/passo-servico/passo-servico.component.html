<h2 class="h5 mb-4">Escolha o serviço</h2>

@if (servicos().length === 0) {
  <p class="text-muted mb-0">Nenhum serviço disponível para este profissional.</p>
} @else {
  <div class="list-group">
    @for (servico of servicos(); track servico.id) {
      <button
        type="button"
        class="list-group-item list-group-item-action d-flex align-items-center gap-3"
        (click)="selecionado.emit(servico)"
      >
        <div>
          <div class="fw-semibold">{{ servico.nome }}</div>
          <small class="text-muted">{{ servico.duracao }} min</small>
        </div>
        <span class="ms-auto fw-semibold text-primary">{{ formatarPreco(servico.preco) }}</span>
        <i class="fas fa-chevron-right text-muted"></i>
      </button>
    }
  </div>
}
