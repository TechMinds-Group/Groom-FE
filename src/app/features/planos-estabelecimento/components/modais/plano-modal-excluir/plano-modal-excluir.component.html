<tm-modal
  title="Excluir Plano"
  confirmLabel="Excluir"
  cancelLabel="Cancelar"
  [(show)]="show"
  (confirm)="confirm.emit()"
  (cancel)="cancel.emit()"
  confirmClass="btn-danger"
  icon="fa-solid fa-trash-can"
>
  <div class="text-center p-3">
    <p class="mb-0">
      Tem certeza que deseja excluir o plano <strong>{{ nomePlano() }}</strong>?
    </p>
    <p class="text-danger small mt-2 mb-0">
      <i class="fas fa-exclamation-triangle me-1"></i> Esta ação não poderá ser desfeita.
    </p>
    @if (totalAssinantes() > 0) {
      <p class="text-warning small mt-2 mb-0 fw-semibold">
        <i class="fas fa-exclamation-circle me-1"></i> Este plano possui {{ totalAssinantes() }} assinante(s) vinculado(s).
      </p>
    }
  </div>
</tm-modal>
