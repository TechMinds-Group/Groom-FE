<div class="container-fluid py-2 py-lg-4">
  <div class="d-flex align-items-center justify-content-between mb-2 mb-lg-3">
    <h2 class="h5 mb-0">{{ tituloAgenda() }}</h2>
  </div>
  <tm-calendar
    [(view)]="currentView"
    [viewDate]="viewDate()"
    [events]="events()"
    [showViewSwitcher]="true"
    (viewDateChange)="onDateChange($event)"
    (viewChange)="onViewChange($event)"
  >
    <div filters>
      <div class="d-flex gap-2">
        <span
          class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill px-2 px-lg-3 py-1 py-lg-2 small"
        >
          Filtro: {{ filtroAtivo() }}
        </span>
      </div>
    </div>
  </tm-calendar>
</div>
