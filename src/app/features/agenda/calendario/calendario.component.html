<div class="container-fluid px-1 px-sm-3 py-2 py-lg-4">
  <div class="d-flex align-items-center justify-content-between mb-2 mb-lg-3">
    <h2 class="h6 h5-md fw-bold mb-0 text-truncate">{{ tituloAgenda() }}</h2>
  </div>
  <tm-calendar
    [(view)]="currentView"
    [viewDate]="viewDate()"
    [events]="events()"
    [showViewSwitcher]="true"
    [dayStartHour]="dayStartHour()"
    [dayEndHour]="dayEndHour()"
    (viewDateChange)="onDateChange($event)"
    (viewChange)="onViewChange($event)"
    (dayClicked)="onDayClicked($event)"
    (eventClicked)="onEventClicked($event)"
  >
    <div filters class="d-flex align-items-center gap-2 flex-wrap">
      <div class="agenda-filter-select-wrap">
        <tm-select
          [options]="opcoesFiltroProfissional()"
          [value]="profissionalIdFiltro()"
          (valueChange)="onProfissionalFilterChange($event)"
          icon="fas fa-user-tie text-primary"
          placeholder="Filtrar por profissional..."
          dropdownWidth="240px"
          [darkMode]="themeService.isDarkMode()"
        ></tm-select>
      </div>

      <div class="agenda-filter-select-wrap">
        <tm-select
          [options]="opcoesFiltroStatus"
          [value]="filtroStatus()"
          (valueChange)="onFiltroChange($event)"
          icon="fas fa-filter text-info"
          placeholder="Filtrar por status..."
          dropdownWidth="240px"
          [darkMode]="themeService.isDarkMode()"
        ></tm-select>
      </div>
    </div>
  </tm-calendar>

  <app-agenda-modal-dia
    [(show)]="showModalDia"
    [dataSelecionada]="dataSelecionadaModal()"
    [agendamentos]="agendamentosFiltrados()"
    (mudancaAgendamento)="carregarAgendamentos()"
  ></app-agenda-modal-dia>
</div>
