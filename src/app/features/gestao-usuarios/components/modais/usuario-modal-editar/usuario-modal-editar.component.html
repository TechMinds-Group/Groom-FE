<tm-modal
  [title]="'USUARIOS.MODAL_EDIT.TITLE_EDIT' | translate"
  [confirmLabel]="'USUARIOS.MODAL_EDIT.SAVE' | translate"
  [cancelLabel]="'USUARIOS.MODAL_EDIT.CANCEL' | translate"
  [show]="show()"
  (showChange)="show.set($event)"
  (confirm)="salvar()"
  (cancel)="fechar()"
  confirmClass="btn-primary"
  icon="fas fa-edit"
  size="md"
>
  <form [formGroup]="editForm" class="p-1 text-start">
    <div class="mb-3">
      <tm-text
        formControlName="nome"
        [label]="'USUARIOS.MODAL_EDIT.NAME_LABEL' | translate"
        [placeholder]="'USUARIOS.MODAL_EDIT.NAME_PLACEHOLDER' | translate"
        class="custom-dark-text"
      ></tm-text>
    </div>

    <div class="mb-3">
      <tm-text
        formControlName="email"
        [label]="'USUARIOS.MODAL_EDIT.EMAIL_LABEL' | translate"
        type="email"
        [placeholder]="'USUARIOS.MODAL_EDIT.EMAIL_PLACEHOLDER' | translate"
        class="custom-dark-text"
      ></tm-text>
    </div>

    <div class="mb-3">
      <tm-select
        [label]="('USUARIOS.MODAL_EDIT.PROFILE_LABEL' | translate) + ' (Até 2 perfis)'"
        [options]="perfilOptions()"
        [multiple]="true"
        [value]="perfisSelecionados()"
        (valueChange)="onPerfisChange($event)"
        class="custom-dark-text"
      ></tm-select>
    </div>

    @if (usuario()) {
      <div class="mb-3">
        <label class="form-label fw-semibold text-muted small custom-dark-text">{{ 'USUARIOS.MODAL_EDIT.STATUS_LABEL' | translate }}</label>
        <div class="d-flex gap-2">
          <button
            type="button"
            class="btn flex-fill py-2 fw-semibold status-toggle-btn d-flex align-items-center justify-content-center gap-2"
            [class.status-ativo]="editForm.get('status')?.value === 'Ativo'"
            (click)="editForm.get('status')?.setValue('Ativo')"
          >
            <i class="fas fa-check-circle fs-6"></i> {{ 'USUARIOS.STATUS.ACTIVE' | translate }}
          </button>
          <button
            type="button"
            class="btn flex-fill py-2 fw-semibold status-toggle-btn d-flex align-items-center justify-content-center gap-2"
            [class.status-inativo]="editForm.get('status')?.value === 'Inativo'"
            (click)="editForm.get('status')?.setValue('Inativo')"
          >
            <i class="fas fa-minus-circle fs-6"></i> {{ 'USUARIOS.STATUS.INACTIVE' | translate }}
          </button>
        </div>
      </div>
    }
  </form>
</tm-modal>
