<div class="card border-0 shadow-sm p-4 h-100 actions-card custom-dark-card">
  <h4 class="h5 fw-bold mb-4 custom-dark-text">
    <i class="fas fa-sliders-h me-2 text-primary"></i>{{ 'USUARIOS.DETAILS.QUICK_ACTIONS' | translate }}
  </h4>
  
  <div class="d-grid gap-3">
    @if (isAdmin() || currentUserId() === usuario().id) {
      <button (click)="editar.emit()" class="btn btn-primary py-2.5 fw-bold w-100 transition-all custom-action-btn">
        <i class="fas fa-edit me-2"></i>{{ 'USUARIOS.DETAILS.EDIT' | translate }}
      </button>

      <button (click)="alterarSenha.emit()" class="btn btn-warning py-2.5 fw-bold w-100 transition-all custom-action-btn">
        <i class="fas fa-key me-2"></i>{{ 'USUARIOS.DETAILS.CHANGE_PASSWORD' | translate }}
      </button>
    }
    
    @if (isAdmin()) {
      <button (click)="excluir.emit()" class="btn btn-outline-danger py-2.5 fw-bold w-100 transition-all custom-action-btn">
        <i class="fas fa-trash-can me-2"></i>{{ 'USUARIOS.DETAILS.DELETE' | translate }}
      </button>
    }
  </div>
</div>
