<div class="card border-0 shadow-sm p-4 h-100 details-card custom-dark-card">
  <div class="d-flex align-items-center gap-3 border-bottom pb-4 mb-4">
    <div
      class="avatar-circle bg-primary-subtle text-primary d-flex align-items-center justify-content-center"
    >
      <i class="fas fa-user fs-3"></i>
    </div>
    <div>
      <h2 class="h3 fw-bold mb-1 custom-dark-text">{{ usuario().nome }}</h2>
      <p class="text-muted mb-0 custom-dark-text">{{ usuario().email }}</p>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-sm-6 col-12">
      <label class="form-label small fw-bold text-muted text-uppercase tracking-wider">{{
        'USUARIOS.DETAILS.PROFILE' | translate
      }}</label>
      <div class="mt-1 d-flex flex-wrap gap-2">
        @for (badge of (usuario() | perfilBadge); track badge.label) {
          <span
            class="badge border px-3 py-1.5 rounded-pill fw-semibold"
            [ngClass]="badge.badgeClass"
          >
            <i [class]="badge.iconClass" class="me-1"></i>{{ badge.label }}
          </span>
        }
      </div>
    </div>

    <div class="col-sm-6 col-12">
      <label class="form-label small fw-bold text-muted text-uppercase tracking-wider">{{
        'USUARIOS.DETAILS.STATUS' | translate
      }}</label>
      <div class="mt-1">
        @if (usuario().status | statusBadge; as badge) {
          <span
            class="badge border px-3 py-1.5 rounded-pill fw-semibold"
            [ngClass]="badge.badgeClass"
          >
            <i [class]="badge.iconClass" class="me-1"></i>{{ badge.label }}
          </span>
        }
      </div>
    </div>
  </div>
</div>
