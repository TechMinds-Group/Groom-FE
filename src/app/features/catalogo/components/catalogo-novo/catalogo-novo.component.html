<div class="container mt-5 mb-5">
  <!-- Header: botão voltar + título fixo -->
  <div class="d-flex align-items-center gap-3 mb-4">
    <button (click)="voltar()" class="btn btn-light shadow-sm rounded-circle p-0 d-flex align-items-center justify-content-center btn-voltar" title="Cancelar cadastro">
      <i class="fas fa-arrow-left text-muted"></i>
    </button>
    <div>
      <h1 class="h2 text-primary fw-bold mb-1 custom-dark-text">Cadastrar Serviço</h1>
      <p class="text-muted small mb-0 custom-dark-text">Preencha os dados do novo serviço.</p>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-12">
      <div class="card border-0 shadow-sm p-4 custom-dark-card">
        <form [formGroup]="form" (ngSubmit)="salvar()">
          <div class="row g-3">
            <!-- Nome do serviço -->
            <div class="col-sm-6 col-12">
              <tm-text
                formControlName="nome"
                label="Nome do Serviço *"
                placeholder="Ex: Corte de Cabelo"
                class="custom-dark-text"
              ></tm-text>
              @if (form.get('nome')?.touched && form.get('nome')?.invalid) {
                <div class="text-danger extra-small mt-1">Nome é obrigatório (máx. 60 caracteres).</div>
              }
            </div>

            <!-- Preço -->
            <div class="col-sm-6 col-12">
              <tm-text
                formControlName="preco"
                label="Preço (R$) *"
                placeholder="R$ 0,00"
                mask="currency"
                [maxlength]="14"
                class="custom-dark-text"
              ></tm-text>
              @if (form.get('preco')?.touched && form.get('preco')?.invalid) {
                <div class="text-danger extra-small mt-1">Preço válido é obrigatório.</div>
              }
            </div>

            <!-- Duração -->
            <div class="col-sm-6 col-12">
              <tm-text
                formControlName="duracao"
                type="number"
                label="Duração (minutos)"
                placeholder="Ex: 30"
                class="custom-dark-text"
              ></tm-text>
            </div>
          </div>

          <!-- Ações -->
          <div class="d-flex gap-3 mt-4 justify-content-end flex-column flex-sm-row">
            <button type="button" class="btn btn-outline-secondary fw-semibold px-4 py-2" (click)="voltar()">
              Cancelar
            </button>
            <button type="submit" class="btn btn-primary fw-bold px-4 py-2" [disabled]="salvando()">
              @if (salvando()) {
                <span class="spinner-border spinner-border-sm me-2" role="status"></span>Salvando...
              } @else {
                <i class="fas fa-save me-2"></i>Cadastrar
              }
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
