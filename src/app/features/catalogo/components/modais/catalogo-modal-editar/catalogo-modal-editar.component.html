<tm-modal
  title="Editar Serviço"
  confirmLabel="Salvar"
  cancelLabel="Cancelar"
  [show]="show()"
  (showChange)="show.set($event)"
  (confirm)="salvar()"
  (cancel)="fechar()"
  confirmClass="btn-primary"
  icon="fas fa-edit"
  size="md"
>
  <form [formGroup]="editForm" class="p-1 text-start">
    <div class="mb-3">
      <tm-text
        formControlName="nome"
        label="Nome do Serviço"
        placeholder="Ex: Corte de Cabelo"
        class="custom-dark-text"
      ></tm-text>
      @if (editForm.get('nome')?.touched && editForm.get('nome')?.invalid) {
        <div class="text-danger extra-small mt-1">Nome é obrigatório (máx. 60 caracteres).</div>
      }
    </div>

    <div class="mb-3">
      <tm-text
        formControlName="preco"
        type="number"
        label="Preço (R$)"
        placeholder="R$ 0,00"
        class="custom-dark-text"
      ></tm-text>
      @if (editForm.get('preco')?.touched && editForm.get('preco')?.invalid) {
        <div class="text-danger extra-small mt-1">Preço válido é obrigatório.</div>
      }
    </div>

    <div class="mb-3">
      <tm-text
        formControlName="duracao"
        type="number"
        label="Duração (minutos)"
        placeholder="Ex: 30"
        class="custom-dark-text"
      ></tm-text>
    </div>

    @if (servico()) {
      <div class="mb-3">
        <label class="form-label fw-semibold text-muted small custom-dark-text">Status</label>
        <div class="d-flex gap-2">
          <button
            type="button"
            class="btn flex-fill py-2 fw-semibold status-toggle-btn d-flex align-items-center justify-content-center gap-2"
            [class.status-ativo]="editForm.get('status')?.value === 'Ativo'"
            (click)="editForm.get('status')?.setValue('Ativo')"
          >
            <i class="fas fa-check-circle fs-6"></i> Ativo
          </button>
          <button
            type="button"
            class="btn flex-fill py-2 fw-semibold status-toggle-btn d-flex align-items-center justify-content-center gap-2"
            [class.status-inativo]="editForm.get('status')?.value === 'Inativo'"
            (click)="editForm.get('status')?.setValue('Inativo')"
          >
            <i class="fas fa-minus-circle fs-6"></i> Inativo
          </button>
        </div>
      </div>
    }
  </form>
</tm-modal>
