<div class="container mt-5 mb-5">
  @if (assinante(); as a) {
    <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between mb-4 gap-3">
      <div class="d-flex align-items-center gap-3">
        <button (click)="voltar()" class="btn btn-light shadow-sm rounded-circle p-0 d-flex align-items-center justify-content-center btn-voltar" title="Voltar">
          <i class="fas fa-arrow-left text-muted"></i>
        </button>

        <div>
          <h2 class="h4 mb-0 fw-bold custom-dark-text d-flex align-items-center gap-2">
            {{ a.clienteNome }}
          </h2>
          <span class="text-muted small custom-dark-text">Detalhes do Assinante</span>
        </div>
      </div>
    </div>

    <div class="row g-4 mb-5">
      <div class="col-lg-8 col-12">
        <app-assinante-detalhes-geral [assinante]="a" />
      </div>

      <div class="col-lg-4 col-12">
        <app-assinante-detalhes-acoes
          (editar)="abrirEdicao()"
          (excluir)="excluir()"
        />
      </div>
    </div>

    <div class="row mb-5">
      <div class="col-12">
        <h5 class="fw-bold mb-3 custom-dark-text">
          <i class="fas fa-file-invoice-dollar me-2 text-primary"></i>Histórico de Pagamentos
        </h5>

        <tm-table
          [cols]="cols()"
          [data]="a.historicoPagamentos"
          [paginated]="false"
          [showControls]="false"
        ></tm-table>
      </div>
    </div>
  } @else {
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Carregando...</span>
      </div>
      <p class="text-muted mt-3">Carregando informações do assinante...</p>
    </div>
  }
</div>

<app-assinante-modal-editar
  [(show)]="showEditModal"
  [assinante]="assinante()"
  [clubeOptions]="clubeOptions()"
  (confirm)="salvarEdicao($event)"
/>

<app-assinante-modal-excluir
  [(show)]="showDeleteConfirmModal"
  [nomeAssinante]="assinante()?.clienteNome || ''"
  (confirm)="confirmarExcluir()"
/>
