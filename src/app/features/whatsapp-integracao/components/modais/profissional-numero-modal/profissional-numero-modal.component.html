@if (show()) {
  <tm-modal
    [title]="configParaEditar() ? 'Editar WhatsApp do Profissional' : 'Cadastrar WhatsApp do Profissional'"
    (closeModal)="fechar()"
  >
    <div class="modal-body py-3">
      @if (erro(); as msg) {
        <div class="alert alert-danger d-flex align-items-center gap-2 mb-3" role="alert">
          <i class="fas fa-exclamation-circle"></i>
          <span>{{ msg }}</span>
        </div>
      }

      <div class="mb-3">
        <label for="selectProfissional" class="form-label fw-semibold custom-dark-text">Profissional</label>
        @if (configParaEditar(); as config) {
          <input
            type="text"
            class="form-control custom-dark-input"
            [value]="config.profissionalNome || 'Profissional'"
            disabled
          />
        } @else {
          <select
            id="selectProfissional"
            class="form-select custom-dark-input"
            [ngModel]="profissionalId()"
            (ngModelChange)="onProfissionalChange($event)"
          >
            <option value="" disabled selected>Selecione o profissional...</option>
            @for (prof of profissionaisDisponiveis(); track prof.profissionalId) {
              <option [value]="prof.profissionalId">{{ prof.profissionalNome }}</option>
            }
          </select>
        }
      </div>

      <div class="mb-3">
        <label for="inputNumero" class="form-label fw-semibold custom-dark-text">Número de WhatsApp (DDD + Número)</label>
        <input
          id="inputNumero"
          type="text"
          class="form-control custom-dark-input"
          placeholder="Ex: 11999999999"
          [ngModel]="numeroCelular()"
          (ngModelChange)="onNumeroChange($event)"
        />
        <div class="form-text custom-dark-muted">Informe apenas os dígitos numéricos com DDD (10 a 13 dígitos).</div>
      </div>
    </div>

    <div class="modal-footer d-flex justify-content-end gap-2 pt-3 border-top">
      <button type="button" class="btn btn-outline-secondary px-4" (click)="fechar()">
        Cancelar
      </button>
      <button type="button" class="btn btn-success px-4 fw-bold" (click)="submeter()">
        Salvar
      </button>
    </div>
  </tm-modal>
}
