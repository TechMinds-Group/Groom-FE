<div class="container mt-5 mb-5">
  <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between mb-4 gap-3">
    <div class="d-flex align-items-center gap-3">
      <button
        (click)="voltar()"
        class="btn btn-light shadow-sm rounded-circle p-0 d-flex align-items-center justify-content-center btn-voltar"
        title="Voltar para Configurações"
      >
        <i class="fas fa-arrow-left custom-dark-text"></i>
      </button>

      <div>
        <h1 class="h2 text-primary fw-bold mb-1 custom-dark-text d-flex align-items-center gap-2">
          <i class="fas fa-history me-2"></i>Logs do Sistema
        </h1>
        <p class="text-muted custom-dark-text mb-0">
          Acompanhe o histórico completo de movimentações, auditorias e eventos do sistema.
        </p>
      </div>
    </div>
  </div>

  <!-- Filtros -->
  <div class="card border-0 shadow-sm p-4 custom-dark-card rounded-4 mb-4">
    <div class="row g-3 align-items-end">
      <div class="col-md-7 col-12">
        <tm-text
          [value]="termoBusca()"
          (valueChange)="atualizarBusca($event)"
          label="Buscar em Logs"
          placeholder="Pesquisar por usuário, ação ou detalhe..."
          icon="fas fa-search"
          class="custom-dark-text"
        ></tm-text>
      </div>

      <div class="col-md-5 col-12">
        <label class="form-label small fw-bold text-muted text-uppercase tracking-wider custom-dark-text">Filtrar por Módulo</label>
        <select
          [ngModel]="moduloFiltro()"
          (ngModelChange)="onModuloChange($event)"
          class="form-select custom-dark-card custom-dark-text rounded-3"
        >
          <option value="todos">Todos os Módulos</option>
          <option value="Agenda">Agenda</option>
          <option value="Clientes">Clientes</option>
          <option value="Assinantes">Assinantes</option>
          <option value="Usuários">Usuários</option>
          <option value="Catálogo">Catálogo</option>
          <option value="Configurações">Configurações</option>
          <option value="WhatsApp">WhatsApp</option>
          <option value="Autenticação">Autenticação</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Tabela de Logs -->
  <div class="mb-5">
    <tm-table
      [cols]="cols()"
      [data]="logsFiltrados()"
      [isLoading]="carregando()"
      [paginated]="true"
      [pageSize]="tamanhoPagina()"
      (pageSizeChange)="tamanhoPagina.set($event)"
      [showControls]="true"
    ></tm-table>
  </div>
</div>

<!-- Templates customizados -->
<ng-template #dataHoraTemplate let-item>
  <span class="custom-dark-text small font-monospace">
    <i class="far fa-clock text-primary me-1.5"></i>{{ item.dataHora | date:'dd/MM/yyyy HH:mm:ss' }}
  </span>
</ng-template>

<ng-template #usuarioTemplate let-item>
  <div class="d-flex flex-column text-start">
    <strong class="fw-bold custom-dark-text">{{ item.usuario }}</strong>
    <span class="text-muted extra-small custom-dark-text">IP: {{ item.ip }}</span>
  </div>
</ng-template>

<ng-template #moduloTemplate let-item>
  <span class="badge bg-secondary-subtle text-secondary border border-secondary-subtle px-2.5 py-1 rounded-pill small fw-semibold">
    {{ item.modulo }}
  </span>
</ng-template>

<ng-template #detalhesTemplate let-item>
  <div class="d-flex flex-column text-start">
    <strong class="fw-bold custom-dark-text small">{{ item.acao }}</strong>
    <span class="text-muted extra-small custom-dark-text text-break">{{ item.detalhes }}</span>
  </div>
</ng-template>

<ng-template #statusTemplate let-item>
  <span
    class="badge rounded-pill small fw-semibold border px-2.5 py-1"
    [ngClass]="{
      'bg-success-subtle text-success border-success-subtle': item.status === 'Sucesso',
      'bg-warning-subtle text-warning border-warning-subtle': item.status === 'Alerta',
      'bg-danger-subtle text-danger border-danger-subtle': item.status === 'Erro'
    }"
  >
    <i
      class="me-1"
      [ngClass]="{
        'fas fa-check-circle': item.status === 'Sucesso',
        'fas fa-exclamation-triangle': item.status === 'Alerta',
        'fas fa-times-circle': item.status === 'Erro'
      }"
    ></i>
    {{ item.status }}
  </span>
</ng-template>
