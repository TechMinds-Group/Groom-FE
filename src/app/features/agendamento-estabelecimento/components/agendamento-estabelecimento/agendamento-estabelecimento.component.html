<div class="container py-4">
  <h1 class="h4 mb-1">Link de Agendamento</h1>
  <p class="text-muted mb-4">
    Compartilhe este link com seus clientes para que eles marquem serviços online.
  </p>

  <div class="card">
    <div class="card-body">
      <div class="input-group">
        <input
          type="text"
          class="form-control"
          [value]="linkAgendamento"
          readonly
          aria-label="Link público de agendamento"
        />
        <button type="button" class="btn btn-primary" (click)="copiarLink()">
          @if (copiado()) {
            <i class="fas fa-check me-1"></i>
            Copiado!
          } @else {
            <i class="fas fa-copy me-1"></i>
            Copiar link
          }
        </button>
      </div>

      <div class="d-flex gap-2 mt-3 flex-wrap">
        <button type="button" class="btn btn-outline-primary" (click)="abrirPreview()">
          <i class="fas fa-eye me-1"></i>
          Ver página do cliente
        </button>
        <a
          class="btn btn-outline-success"
          [href]="linkWhatsApp"
          target="_blank"
          rel="noopener"
        >
          <i class="fab fa-whatsapp me-1"></i>
          Compartilhar no WhatsApp
        </a>
      </div>
    </div>
  </div>
</div>
